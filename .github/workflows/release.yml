name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runs-on: macos-latest
          - os: macos
            arch: x86_64
            runs-on: macos-13
          - os: linux
            arch: x86_64
            runs-on: ubuntu-latest

    runs-on: ${{ matrix.runs-on }}
    name: Build ${{ matrix.os }} ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg mupdf libomp pkg-config

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libmupdf-dev libomp-dev pkg-config

      - name: Build
        run: make

      - name: Smoke test
        run: ./src/badapplestein --help

      - name: Package tarball
        run: |
          STAGING=$(mktemp -d)
          cp src/badapplestein "$STAGING/"
          cd "$STAGING"
          ln -sf badapplestein arrange
          ln -sf badapplestein render
          cd -
          cp README.md "$STAGING/"
          if [ -d man ]; then
            mkdir -p "$STAGING/man"
            cp man/*.1 "$STAGING/man/"
          fi
          tar czf badapplestein-${{ matrix.os }}-${{ matrix.arch }}.tar.gz -C "$STAGING" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: badapplestein-${{ matrix.os }}-${{ matrix.arch }}
          path: badapplestein-${{ matrix.os }}-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.tar.gz
