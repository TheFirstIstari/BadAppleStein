name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runs-on: macos-latest
          - os: linux
            runs-on: ubuntu-latest

    runs-on: ${{ matrix.runs-on }}
    name: Build ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg libomp pkg-config

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libomp-dev pkg-config

      - name: Build
        run: make

      - name: Smoke test
        run: ./src/badapplestein --help
