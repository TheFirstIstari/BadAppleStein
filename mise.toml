# BadAppleStein - Mise task runner configuration (standalone)
# Generalized pipeline: arrange (C matcher) -> render (video assembly)

[tools]
python = "3.12"

[tasks.build-arrange]
description = "Compile arrangement engine (pure C, libav, OpenMP matcher)"
run = '''
set -e

# Detect ffmpeg/libav flags — try pkg-config first, then common paths
AVFLAGS="$(PKG_CONFIG_PATH="$PKG_CONFIG_PATH:/opt/homebrew/Cellar/ffmpeg/8.1.2_1/lib/pkgconfig:/opt/homebrew/lib/pkgconfig" \
    pkg-config --cflags --libs libavformat libavcodec libavutil libswscale 2>/dev/null)" || true
if [[ -z "$AVFLAGS" ]]; then
    if [[ -d "/opt/homebrew/include/libavformat" ]]; then
        AVFLAGS="-I/opt/homebrew/include -L/opt/homebrew/lib -lavformat -lavcodec -lavutil -lswscale"
    elif [[ -d "/usr/local/include/libavformat" ]]; then
        AVFLAGS="-I/usr/local/include -L/usr/local/lib -lavformat -lavcodec -lavutil -lswscale"
    else
        echo "[ERROR] ffmpeg/libav not found. Install with: brew install ffmpeg"
        exit 1
    fi
fi

if [[ "$(uname -s)" == "Darwin" ]]; then
    OMP_PREFIX="$(brew --prefix libomp 2>/dev/null)"
    if [[ -n "$OMP_PREFIX" && -d "$OMP_PREFIX" ]]; then
        clang -O3 -march=native -funroll-loops -Xpreprocessor -fopenmp \
            -I"$OMP_PREFIX/include" -L"$OMP_PREFIX/lib" -lomp \
            $AVFLAGS arrange.c match.c imgops.c video.c cli.c -lm -o arrange
    else
        echo "[WARN] libomp not found — building without OpenMP (single-threaded matching)"
        clang -O3 -march=native -funroll-loops \
            $AVFLAGS arrange.c match.c imgops.c video.c cli.c -lm -o arrange
    fi
else
    gcc -O3 -march=native -funroll-loops -fopenmp \
        $AVFLAGS arrange.c match.c imgops.c video.c cli.c -lm -o arrange
fi
echo "Built ./arrange"
'''

[tasks.build-render]
description = "Compile render engine (pure C, libav, mupdf)"
run = '''
set -e
AVFLAGS="$(PKG_CONFIG_PATH="$PKG_CONFIG_PATH:/opt/homebrew/Cellar/ffmpeg/8.1.2_1/lib/pkgconfig:/opt/homebrew/lib/pkgconfig" \
    pkg-config --cflags --libs libavformat libavcodec libavutil libswscale 2>/dev/null)" || true
if [[ -z "$AVFLAGS" ]]; then
    if [[ -d "/opt/homebrew/include/libavformat" ]]; then
        AVFLAGS="-I/opt/homebrew/include -L/opt/homebrew/lib -lavformat -lavcodec -lavutil -lswscale"
    elif [[ -d "/usr/local/include/libavformat" ]]; then
        AVFLAGS="-I/usr/local/include -L/usr/local/lib -lavformat -lavcodec -lavutil -lswscale"
    else
        echo "[ERROR] ffmpeg/libav not found. Install with: brew install ffmpeg"
        exit 1
    fi
fi
MUPDF_FLAGS="$(pkg-config --cflags --libs mupdf 2>/dev/null || true)"
if [[ -z "$MUPDF_FLAGS" ]]; then
    # Homebrew fallback (mupdf ships no .pc file)
    MUPDF_PREFIX="$(brew --prefix mupdf 2>/dev/null || true)"
    if [[ -n "$MUPDF_PREFIX" && -d "$MUPDF_PREFIX/include/mupdf" ]]; then
        MUPDF_FLAGS="-I$MUPDF_PREFIX/include -L$MUPDF_PREFIX/lib -lmupdf -lmupdf-third"
    fi
fi
if [[ -n "$MUPDF_FLAGS" ]]; then
    clang -O3 -march=native -funroll-loops \
        $AVFLAGS $MUPDF_FLAGS render.c pdf.c video.c imgops.c cli.c -lm -DHAVE_MUPDF -o render
else
    echo "[WARN] mupdf not found — building render without PDF support (install with: brew install mupdf)"
    clang -O3 -march=native -funroll-loops \
        $AVFLAGS render.c pdf.c video.c imgops.c cli.c -lm -o render
fi
echo "Built ./render"
'''

[tasks.arrange]
description = "Stage 1 (C): Analyze video frames and match to source library"
run = '''
VIDEO="${1:-../badapple.mp4}"
shift 2>/dev/null || true
FEAT="${MISE_FEATURES:-features.bin}"
REG="${MISE_REGISTRY:-registry.bin}"
MAN="${MISE_MANIFESTS:-manifests_greedy}"
./arrange --video "$VIDEO" --features "$FEAT" --registry "$REG" --manifests "$MAN" "$@"
'''
depends = ["build-arrange"]

[tasks.render]
description = "Stage 2: Render final video from manifests (grayscale, needs mupdf)"
run = '''
MAN="${MISE_MANIFESTS:-manifests_greedy}"
REG="${MISE_REGISTRY:-registry.bin}"
W="${MISE_WIDTH:-7680}"
H="${MISE_HEIGHT:-4320}"
FPS="${MISE_FPS:-60}"
OUT="${MISE_OUTPUT:-Bad_Apple_8K_YOUTUBE.mov}"
./render --manifests "$MAN" --registry "$REG" --output "$OUT" --width "$W" --height "$H" --fps "$FPS" "$@"
'''
depends = ["build-render"]

[tasks.run]
description = "Run full pipeline: arrange then render"
depends = ["arrange", "render"]

[tasks.test]
description = "Clean, build, and run a quick test (50 frames)"
run = '''
set -e
VIDEO="${1:-../badapple.mp4}"
LIB="${2:-test_lib}"
shift 2 2>/dev/null || true

echo "--- test: clean ---"
rm -rf manifests_greedy/ atlas_cache/ *.mov

echo "--- test: build arrange ---"
mise run build-arrange

echo "--- test: arrange (50 frames) ---"
MISE_FEATURES="$LIB/features.bin" MISE_REGISTRY="$LIB/registry.bin" \
    ./arrange --video "$VIDEO" --features "$LIB/features.bin" \
    --registry "$LIB/registry.bin" --manifests manifests_greedy --max-frames 50 "$@"

echo "--- test: build render ---"
mise run build-render

echo "--- test: render (50 frames) ---"
MISE_REGISTRY="$LIB/registry.bin" \
    ./render --manifests manifests_greedy --registry "$LIB/registry.bin" \
    --output test_output.mov --width 7680 --height 4320 --fps 60 \
    --max-frames 50 "$@"

echo "--- test: output ---"
ls -lh test_output.mov
echo "--- test: PASSED ---"
'''

[tasks.gen-lib]
description = "Generate a test library with random features, registry, and PDF"
run = "python3 gen_test_lib.py ${@:---pages 200 --seed 42 --output test_lib}"

[tasks.benchmark-arrange]
description = "Benchmark stage 1 (arrangement) with timing"
run = "hyperfine --warmup 1 './arrange --video ../badapple.mp4 --max-frames 200' --export-json benchmark-arrange.json"
depends = ["build-arrange"]

[tasks.benchmark-render]
description = "Benchmark stage 2 (rendering) with timing"
run = "hyperfine --warmup 1 './render --manifests manifests_greedy --registry registry.bin --output /dev/null --width 7680 --height 4320 --fps 60' --export-json benchmark-render.json"
depends = ["build-render"]

[tasks.clean]
description = "Remove generated artifacts (manifests, cache, output)"
run = "rm -rf manifests_greedy/ atlas_cache/ Bad_Apple_8K_YOUTUBE.mov temp_master.mov benchmark-*.json"

[tasks.clean-all]
description = "Remove all generated artifacts including library cache"
run = "rm -rf manifests_greedy/ atlas_cache/ library.pkl features.bin registry.bin *.mov *.json arrange"
